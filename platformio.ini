; CAN Bus Tester — M5StickC PLUS2 + M5Stack CAN Unit (CA-IS3050G)
; PlatformIO project configuration

[env:m5stickc-plus2]
platform      = espressif32
; m5stickc_plus2 is only in newer platform releases.
; m5stick-c uses the same ESP32-PICO chip family and compiles correctly.
; M5Unified detects the actual hardware (PLUS2 vs original) at runtime
; via I2C scanning — the board label does not affect runtime behaviour.
board         = m5stick-c
framework     = arduino
monitor_speed = 115200
upload_speed  = 1500000

; No PSRAM build flags: the m5stick-c board definition does not enable
; PSRAM, so adding -DBOARD_HAS_PSRAM causes the SDK to initialise PSRAM
; with the wrong pin settings, crashing before setup() runs.
; The 63 KB canvas sprite fits in the 520 KB internal SRAM without PSRAM.

lib_deps =
    ; M5Unified: unified library for all M5Stack devices (display, buttons, IMU, power)
    m5stack/M5Unified @ ^0.2.4
    ; M5GFX: graphics driver (pulled in by M5Unified, explicit pin avoids version drift)
    m5stack/M5GFX @ ^0.2.4

; Note: No external CAN library required.
; The ESP32's built-in TWAI (CAN) controller is accessed directly via
; the ESP-IDF "driver/twai.h" header included with the espressif32 platform.
